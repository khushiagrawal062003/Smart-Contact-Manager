<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base::layout(~{::section})}">
<head>
    <meta charset="UTF-8">
    <title>Error - Smart Contact Manager</title>
</head>
<body>
    <section>
        <div class="row justify-content-center py-5">
            <div class="col-md-7 text-center">
                <div class="display-1 fw-bold text-dark mb-3" style="font-size: 6rem; letter-spacing: -2px;">Error</div>
                <h2 class="fw-bold mb-3">Something Went Wrong</h2>
                <p class="text-muted mb-4 fs-6">
                    An unexpected event occurred while processing your request. Please try navigating back or contact the support desk.
                </p>
                <div class="d-flex justify-content-center gap-3">
                    <a th:href="@{/}" class="btn btn-primary-custom rounded-pill px-4">
                        <i class="bi bi-house me-2"></i>Go Home
                    </a>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
