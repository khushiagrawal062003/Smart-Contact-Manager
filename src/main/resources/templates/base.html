<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Smart Contact Manager</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css" rel="stylesheet">
    
    <!-- SweetAlert2 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.1/dist/sweetalert2.min.css" rel="stylesheet">
    
    <!-- Custom Style Sheet -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <!-- 1. Top Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-light navbar-custom sticky-top">
        <div class="container-fluid px-4">
            <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/}">
                <i class="bi bi-person-rolodex fs-3"></i>
                <span class="fs-4">SmartContact</span>
            </a>
            
            <button class="navbar-toggler border-0" type="button" onclick="toggleSidebar()" aria-label="Toggle navigation">
                <i class="bi bi-list fs-2"></i>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center gap-3">
                    <li class="nav-item">
                        <a class="nav-link fw-semibold" th:href="@{/}">Home</a>
                    </li>
                    
                    <!-- If user is logged in -->
                    <li class="nav-item d-flex align-items-center gap-2" th:if="${loggedUser != null}">
                        <a th:href="@{/user/profile}" class="d-flex align-items-center gap-2 text-decoration-none text-dark">
                            <!-- Show custom uploaded image, or fallback to default -->
                            <img th:src="${loggedUser.imageUrl == 'default.png' ? 'https://avatar.iran.liara.run/public' : '/img/uploads/user/' + loggedUser.imageUrl}" 
                                 class="profile-pic-nav" alt="Profile">
                            <span class="fw-semibold" th:text="${loggedUser.name}">User Name</span>
                        </a>
                    </li>
                    
                    <li class="nav-item" th:if="${loggedUser != null}">
                        <a class="btn btn-outline-danger btn-sm rounded-pill px-3" th:href="@{/logout}">
                            <i class="bi bi-box-arrow-right me-1"></i>Logout
                        </a>
                    </li>
                    
                    <!-- If user is guest -->
                    <li class="nav-item" th:if="${loggedUser == null}">
                        <a class="btn btn-primary-custom btn-sm rounded-pill px-3" th:href="@{/signin}">
                            <i class="bi bi-box-arrow-in-right me-1"></i>Login
                        </a>
                    </li>
                    <li class="nav-item" th:if="${loggedUser == null}">
                        <a class="btn btn-outline-dark btn-sm rounded-pill px-3" th:href="@{/register}">Register</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 2. Dynamic Sidebar (Visible only when user is logged in) -->
    <div class="sidebar" th:if="${loggedUser != null}">
        <ul class="nav flex-column">
            <li class="nav-item">
                <a class="nav-link" th:classappend="${activePage == 'dashboard' ? 'active' : ''}" th:href="@{/user/index}">
                    <i class="bi bi-grid-1x2-fill"></i>Dashboard
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:classappend="${activePage == 'view-contacts' ? 'active' : ''}" th:href="@{/user/show-contacts/0}">
                    <i class="bi bi-people-fill"></i>View Contacts
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:classappend="${activePage == 'add-contact' ? 'active' : ''}" th:href="@{/user/add-contact}">
                    <i class="bi bi-person-plus-fill"></i>Add Contact
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:classappend="${activePage == 'profile' ? 'active' : ''}" th:href="@{/user/profile}">
                    <i class="bi bi-person-badge-fill"></i>My Profile
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:classappend="${activePage == 'settings' ? 'active' : ''}" th:href="@{/user/settings}">
                    <i class="bi bi-gear-fill"></i>Settings
                </a>
            </li>
            <hr class="text-muted my-2">
            <li class="nav-item">
                <a class="nav-link text-danger" th:href="@{/logout}">
                    <i class="bi bi-box-arrow-left"></i>Logout
                </a>
            </li>
        </ul>
    </div>

    <!-- 3. Main Work Container -->
    <div th:class="${loggedUser != null ? 'content-wrapper' : 'container py-5'}">
        
        <!-- Flash Message Alerts -->
        <div th:if="${message}" th:classappend="'alert-' + ${message.type}" class="alert alert-dismissible fade show glass-card border-0 mb-4 px-4 py-3" role="alert">
            <div class="d-flex align-items-center gap-2">
                <i class="bi" th:classappend="${message.type == 'success' ? 'bi-check-circle-fill text-success' : 'bi-exclamation-triangle-fill text-danger'}"></i>
                <span th:text="${message.content}">Alert Text Content</span>
            </div>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <!-- Render Child Templates Fragment -->
        <div th:replace="${content}"></div>
    </div>

    <!-- Bootstrap 5 JavaScript Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- SweetAlert2 JS -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.1/dist/sweetalert2.all.min.js"></script>
    
    <!-- Custom JS -->
    <script th:src="@{/js/script.js}"></script>
</body>
</html>
