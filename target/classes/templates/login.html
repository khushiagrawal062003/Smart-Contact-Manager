<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base::layout(~{::section})}">
<head>
    <meta charset="UTF-8">
    <title>Login - Smart Contact Manager</title>
</head>
<body>
    <section class="d-flex align-items-center py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5">
                    <div class="glass-card p-5 border-0">
                        <div class="text-center mb-4">
                            <div class="d-inline-flex align-items-center justify-content-center bg-primary-subtle text-primary rounded-circle p-3 mb-3" style="width: 60px; height: 60px;">
                                <i class="bi bi-box-arrow-in-right fs-3"></i>
                            </div>
                            <h2 class="fw-bold">Welcome Back</h2>
                            <p class="text-muted">Enter credentials to access your CRM</p>
                        </div>

                        <!-- Login Form targeting Spring Security Endpoint /dologin -->
                        <form th:action="@{/dologin}" method="post">
                            
                            <!-- Username (Email) Field -->
                            <div class="mb-3">
                                <label for="username" class="form-label form-label-custom">Email Address</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                                    <input type="email" 
                                           id="username"
                                           name="username" 
                                           placeholder="Enter email address" 
                                           class="form-control form-control-custom border-start-0" 
                                           required>
                                </div>
                            </div>

                            <!-- Password Field -->
                            <div class="mb-4">
                                <div class="d-flex justify-content-between align-items-center mb-1">
                                    <label for="password" class="form-label form-label-custom mb-0">Password</label>
                                    <a href="#" class="text-primary text-decoration-none small">Forgot?</a>
                                </div>
                                <div class="input-group">
                                    <span class="input-group-text bg-white border-end-0"><i class="bi bi-lock text-muted"></i></span>
                                    <input type="password" 
                                           id="password"
                                           name="password" 
                                           placeholder="Enter password" 
                                           class="form-control form-control-custom border-start-0" 
                                           required>
                                </div>
                            </div>

                            <!-- Submit Button -->
                            <div class="d-grid mb-3">
                                <button type="submit" class="btn btn-primary-custom py-2.5">Sign In</button>
                            </div>

                            <div class="text-center">
                                <span class="text-muted small">New to our platform? </span>
                                <a th:href="@{/register}" class="text-primary text-decoration-none small fw-semibold">Register here</a>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
