<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base::layout(~{::section})}">
<head>
    <meta charset="UTF-8">
    <title>404 - Page Not Found</title>
</head>
<body>
    <section>
        <div class="row justify-content-center py-5">
            <div class="col-md-7 text-center">
                <div class="display-1 fw-bold text-indigo mb-3" style="font-size: 6rem; letter-spacing: -2px;">404</div>
                <h2 class="fw-bold mb-3">Oops! Page Lost in Orbit</h2>
                <p class="text-muted mb-4 fs-6">
                    The URL path you requested does not exist or has been relocated. Let's redirect you back to safety.
                </p>
                <div class="d-flex justify-content-center gap-3">
                    <a th:href="@{/}" class="btn btn-primary-custom rounded-pill px-4">
                        <i class="bi bi-house me-2"></i>Go Home
                    </a>
                    <a th:href="@{/user/show-contacts/0}" class="btn btn-outline-dark rounded-pill px-4" th:if="${loggedUser != null}">
                        <i class="bi bi-people me-2"></i>My Contacts
                    </a>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
