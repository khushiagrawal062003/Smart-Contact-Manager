<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base::layout(~{::section})}">
<head>
    <meta charset="UTF-8">
    <title>403 - Access Denied</title>
</head>
<body>
    <section>
        <div class="row justify-content-center py-5">
            <div class="col-md-7 text-center">
                <div class="display-1 fw-bold text-danger mb-3" style="font-size: 6rem; letter-spacing: -2px;">403</div>
                <h2 class="fw-bold mb-3">Restricted Territory</h2>
                <p class="text-muted mb-4 fs-6">
                    You do not have administrative authorization or appropriate clearance roles to view the page at this address.
                </p>
                <div class="d-flex justify-content-center gap-3">
                    <a th:href="@{/}" class="btn btn-outline-dark rounded-pill px-4">
                        <i class="bi bi-house me-2"></i>Go Home
                    </a>
                    <a th:href="@{/user/index}" class="btn btn-primary-custom rounded-pill px-4" th:if="${loggedUser != null}">
                        <i class="bi bi-speedometer2 me-2"></i>Dashboard
                    </a>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
