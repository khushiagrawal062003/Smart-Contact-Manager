<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base::layout(~{::section})}">
<head>
    <meta charset="UTF-8">
    <title>Register - Smart Contact Manager</title>
</head>
<body>
    <section class="d-flex align-items-center py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5">
                    <div class="glass-card p-5 border-0">
                        <div class="text-center mb-4">
                            <div class="d-inline-flex align-items-center justify-content-center bg-primary-subtle text-primary rounded-circle p-3 mb-3" style="width: 60px; height: 60px;">
                                <i class="bi bi-person-plus-fill fs-3"></i>
                            </div>
                            <h2 class="fw-bold">Create Account</h2>
                            <p class="text-muted">Start organizing your contacts efficiently</p>
                        </div>

                        <!-- Registration Form -->
                        <form th:action="@{/do_register}" method="post" th:object="${user}">
                            
                            <!-- Name Field -->
                            <div class="mb-3">
                                <label for="name_field" class="form-label form-label-custom">Full Name</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white border-end-0"><i class="bi bi-person text-muted"></i></span>
                                    <input type="text" 
                                           id="name_field"
                                           name="name" 
                                           placeholder="Enter full name" 
                                           class="form-control form-control-custom border-start-0" 
                                           th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''"
                                           th:value="${user.name}"
                                           required>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                                </div>
                            </div>

                            <!-- Email Field -->
                            <div class="mb-3">
                                <label for="email_field" class="form-label form-label-custom">Email Address</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                                    <input type="email" 
                                           id="email_field"
                                           name="email" 
                                           placeholder="Enter email address" 
                                           class="form-control form-control-custom border-start-0" 
                                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                                           th:value="${user.email}"
                                           required>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                                </div>
                            </div>

                            <!-- Password Field -->
                            <div class="mb-3">
                                <label for="password_field" class="form-label form-label-custom">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white border-end-0"><i class="bi bi-lock text-muted"></i></span>
                                    <input type="password" 
                                           id="password_field"
                                           name="password" 
                                           placeholder="Choose password (min 6 chars)" 
                                           class="form-control form-control-custom border-start-0" 
                                           th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''"
                                           required>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                                </div>
                            </div>

                            <!-- About Field -->
                            <div class="mb-3">
                                <label for="about_field" class="form-label form-label-custom">About Yourself</label>
                                <textarea id="about_field" 
                                          name="about" 
                                          rows="3" 
                                          placeholder="Write something about yourself..." 
                                          class="form-control form-control-custom"
                                          th:text="${user.about}"></textarea>
                            </div>

                            <!-- Terms and Agreement Checkbox -->
                            <div class="form-check mb-4 text-start">
                                <input type="checkbox" name="agreement" class="form-check-input" id="agreement_check">
                                <label class="form-check-label text-muted small" for="agreement_check">
                                    I agree to the <a href="#" class="text-primary text-decoration-none">Terms and Conditions</a>
                                </label>
                            </div>

                            <!-- Submit & Reset Buttons -->
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary-custom py-2.5">Sign Up</button>
                                <button type="reset" class="btn btn-outline-secondary py-2.5 btn-sm">Reset Form</button>
                            </div>

                            <div class="text-center mt-4">
                                <span class="text-muted small">Already have an account? </span>
                                <a th:href="@{/signin}" class="text-primary text-decoration-none small fw-semibold">Login here</a>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
