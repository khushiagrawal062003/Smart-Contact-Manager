<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base::layout(~{::section})}">
<head>
    <meta charset="UTF-8">
    <title>Add Contact - Smart Contact Manager</title>
</head>
<body>
    <section>
        <div class="row justify-content-center">
            <div class="col-lg-10 col-xl-9">
                <div class="glass-card p-5 border-0">
                    <div class="d-flex align-items-center gap-3 mb-4">
                        <div class="d-inline-flex align-items-center justify-content-center bg-primary-subtle text-primary rounded-circle p-3" style="width: 54px; height: 54px;">
                            <i class="bi bi-person-plus-fill fs-3"></i>
                        </div>
                        <div>
                            <h2 class="fw-bold mb-1">Add Contact</h2>
                            <p class="text-muted mb-0">Populate connections database with detail records</p>
                        </div>
                    </div>

                    <!-- Add Contact Form -->
                    <form th:action="@{/user/process-contact}" 
                          method="POST" 
                          th:object="${contact}" 
                          enctype="multipart/form-data">

                        <div class="row g-4">
                            <!-- 1. Full Name -->
                            <div class="col-md-6">
                                <label for="name" class="form-label form-label-custom">Full Name *</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white border-end-0"><i class="bi bi-person text-muted"></i></span>
                                    <input type="text" id="name" name="name" 
                                           class="form-control form-control-custom border-start-0" 
                                           th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''"
                                           placeholder="Enter contact full name" required>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                                </div>
                            </div>

                            <!-- 2. Nickname -->
                            <div class="col-md-6">
                                <label for="secondName" class="form-label form-label-custom">Nickname (Optional)</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white border-end-0"><i class="bi bi-quote text-muted"></i></span>
                                    <input type="text" id="secondName" name="secondName" 
                                           class="form-control form-control-custom border-start-0" 
                                           placeholder="Enter nickname / second name">
                                </div>
                            </div>

                            <!-- 3. Company -->
                            <div class="col-md-6">
                                <label for="work" class="form-label form-label-custom">Company / Work (Optional)</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white border-end-0"><i class="bi bi-building text-muted"></i></span>
                                    <input type="text" id="work" name="work" 
                                           class="form-control form-control-custom border-start-0" 
                                           placeholder="Enter organization / work title">
                                </div>
                            </div>

                            <!-- 4. Email Address -->
                            <div class="col-md-6">
                                <label for="email" class="form-label form-label-custom">Email Address (Optional)</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                                    <input type="email" id="email" name="email" 
                                           class="form-control form-control-custom border-start-0" 
                                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                                           placeholder="Enter email address">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                                </div>
                            </div>

                            <!-- 5. Phone Number -->
                            <div class="col-md-6">
                                <label for="phone" class="form-label form-label-custom">Phone Number *</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white border-end-0"><i class="bi bi-telephone text-muted"></i></span>
                                    <input type="text" id="phone" name="phone" 
                                           class="form-control form-control-custom border-start-0" 
                                           th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid' : ''"
                                           placeholder="Enter valid phone number" required>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                                </div>
                            </div>

                            <!-- 6. Category -->
                            <div class="col-md-6">
                                <label for="category" class="form-label form-label-custom">Category</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white border-end-0"><i class="bi bi-tags text-muted"></i></span>
                                    <select id="category" name="category" class="form-select form-control-custom border-start-0">
                                        <option value="Personal">Personal</option>
                                        <option value="Work">Work</option>
                                        <option value="Family">Family</option>
                                        <option value="Friends">Friends</option>
                                        <option value="Other">Other</option>
                                    </select>
                                </div>
                            </div>

                            <!-- 7. Favorite Checkbox -->
                            <div class="col-12">
                                <div class="form-check form-switch py-2">
                                    <input class="form-check-input" type="checkbox" role="switch" id="favorite" name="favorite">
                                    <label class="form-check-label fw-semibold text-muted text-uppercase tracking-wider small" for="favorite" style="margin-left: 8px;">
                                        Add to Starred / Favorite Connections
                                    </label>
                                </div>
                            </div>

                            <!-- 8. Address -->
                            <div class="col-12">
                                <label for="address" class="form-label form-label-custom">Home / Work Address</label>
                                <textarea id="address" name="address" rows="2" 
                                          class="form-control form-control-custom" 
                                          placeholder="Enter mailing/physical address"></textarea>
                            </div>

                            <!-- 9. Notes / Description -->
                            <div class="col-12">
                                <label for="description" class="form-label form-label-custom">Bio / Notes about contact</label>
                                <textarea id="description" name="description" rows="4" 
                                          class="form-control form-control-custom" 
                                          placeholder="Write some details or notes about your connection..."></textarea>
                            </div>

                            <!-- 10. Contact Profile Picture Upload -->
                            <div class="col-md-8">
                                <label for="contactImage" class="form-label form-label-custom">Profile Avatar (JPG/PNG)</label>
                                <input class="form-control form-control-custom" type="file" id="contactImage" name="contactImage" 
                                       accept="image/*" onchange="previewImage(event, 'previewImg')">
                            </div>

                            <!-- Image Previewer Block -->
                            <div class="col-md-4 text-center d-flex align-items-center justify-content-center">
                                <div class="p-2 border border-dashed rounded-3">
                                    <img id="previewImg" src="https://avatar.iran.liara.run/public" 
                                         class="profile-pic-table" style="width: 80px; height: 80px; object-fit: cover; border-radius: 50%;" 
                                         alt="Avatar Preview">
                                    <div class="small text-muted mt-1" style="font-size: 0.75rem;">Avatar Preview</div>
                                </div>
                            </div>

                            <!-- Submit Buttons -->
                            <div class="col-12 mt-4 text-end">
                                <button type="reset" class="btn btn-light rounded-pill px-4 me-2">Clear</button>
                                <button type="submit" class="btn btn-primary-custom rounded-pill px-5">
                                    Save Connection <i class="bi bi-save ms-1"></i>
                                </button>
                            </div>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
