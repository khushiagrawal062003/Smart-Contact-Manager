<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base::layout(~{::section})}">
<head>
    <meta charset="UTF-8">
    <title>Settings - Smart Contact Manager</title>
</head>
<body>
    <section>
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="glass-card p-5 border-0 text-center">
                    
                    <div class="d-inline-flex align-items-center justify-content-center bg-danger-subtle text-danger rounded-circle p-3 mb-4" style="width: 58px; height: 58px;">
                        <i class="bi bi-shield-lock-fill fs-3"></i>
                    </div>

                    <h2 class="fw-bold mb-1">Account Security</h2>
                    <p class="text-muted mb-4">Modify your password to keep credentials secure</p>

                    <!-- Password Change Form -->
                    <form th:action="@{/user/change-password}" method="POST" class="text-start">
                        
                        <!-- Old Password Field -->
                        <div class="mb-3">
                            <label for="oldPassword" class="form-label form-label-custom">Current Password *</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white border-end-0"><i class="bi bi-key text-muted"></i></span>
                                <input type="password" id="oldPassword" name="oldPassword" 
                                       class="form-control form-control-custom border-start-0" 
                                       placeholder="Enter current account password" required>
                            </div>
                        </div>

                        <!-- New Password Field -->
                        <div class="mb-4">
                            <label for="newPassword" class="form-label form-label-custom">New Password *</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white border-end-0"><i class="bi bi-lock-fill text-muted"></i></span>
                                <input type="password" id="newPassword" name="newPassword" 
                                       class="form-control form-control-custom border-start-0" 
                                       placeholder="Enter new strong password (min 6 chars)" required>
                            </div>
                        </div>

                        <!-- Submit Button -->
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary-custom py-2.5">
                                Update Password <i class="bi bi-shield-check ms-1"></i>
                            </button>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
